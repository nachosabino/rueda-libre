<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
    <legend><strong>Reserva tu bicicleta</strong></legend>
    <p>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required><br><br>

        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" required placeholder="Correo@correo.com"><br><br>

        <label for="fecha">Fecha de reserva:</label>
        <input type="date" id="fecha" name="fecha" required><br><br>

        <label for="hora">Hora de reserva:</label>
        <input type="time" id="hora" name="hora" required><br><br>

        <label for="bicicleta">Tipo de bicicleta:</label>
        <select id="bicicleta" name="bicicleta" required>
            <option value="" disabled selected>Seleccione una opción</option>
            <option value="montaña">Montaña</option>
            <option value="urbana">Urbana</option>
            <option value="eléctrica">Eléctrica</option>
            <option value="niños">Niños</option>
        </select><br><br>

        <fieldset>
            <legend> Descripción </legend>
            <textarea id="descripcion" name="descripcion" rows="4" cols="40" placeholder="Si tiene algun detalle del alquiler, escríbalo aquí..."></textarea>
        </fieldset>

        <input type="submit" value="Reservar">
    </p>
  </fieldset>
</body>
</html>
